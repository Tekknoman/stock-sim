services:
  - type: web
    name: stock-sim-backend
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/simulation/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        fromService:
          name: stock-sim-frontend
          type: web
          property: url
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
